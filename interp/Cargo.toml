[package]
name = "interp"
version = "0.1.0"
edition = "2024"
publish = false

# Fallback runner for programs that recurse deeper than the browser's native stack allows.
# Built to WebAssembly with `npm run build:interp`; the output is committed so the site
# can be built without Rust.

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmi = { version = "2.0.0", default-features = false, features = ["std", "stable", "validate", "auto-dispatch"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
